<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Synthwave Pong</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes neonPulse{0%,100%{text-shadow:0 0 7px #ff6fd8,0 0 20px #ff6fd8,0 0 42px #ff00de,0 0 85px #ff00de}50%{text-shadow:0 0 4px #ff6fd8,0 0 11px #ff6fd8,0 0 25px #ff00de,0 0 50px #ff00de}}
body{background:#08001a;color:#e0e0e0;font-family:'Segoe UI',Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
h1{font-size:1.8rem;letter-spacing:.45em;margin-bottom:.4rem;text-transform:uppercase;color:#ff71c4;animation:neonPulse 2.5s ease-in-out infinite}
.scoreboard{display:flex;gap:2rem;font-size:2.8rem;font-weight:700;margin-bottom:.5rem;align-items:center}
.scoreboard span{min-width:3rem;text-align:center}
.s-left{color:#ff71c4;text-shadow:0 0 15px #ff71c4,0 0 30px #ff00de}
.s-right{color:#00e5ff;text-shadow:0 0 15px #00e5ff,0 0 30px #00b4d8}
.divider{color:#6b3fa0;font-size:2rem}
canvas{border-radius:6px;box-shadow:0 0 30px rgba(255,0,222,.2),0 0 60px rgba(0,229,255,.12);max-width:95vw;max-height:60vh;border:2px solid rgba(255,113,196,.25)}
.controls{display:flex;gap:1rem;margin-top:.8rem}
.controls button{background:rgba(107,63,160,.25);color:#d4a0ff;border:1px solid #6b3fa0;padding:.55rem 1.6rem;border-radius:6px;cursor:pointer;font-size:.9rem;letter-spacing:.08em;transition:.2s}
.controls button:hover{background:rgba(255,0,222,.15);border-color:#ff6fd8;color:#ff71c4;box-shadow:0 0 18px rgba(255,0,222,.35)}
.controls button.active{border-color:#ff6fd8;box-shadow:0 0 14px rgba(255,0,222,.4);color:#ff71c4}
.info{font-size:.75rem;color:#6b3fa0;margin-top:.6rem;display:flex;gap:1.5rem}
.speedbar-container{display:flex;gap:1rem;align-items:center;margin-top:.5rem;font-size:.7rem;color:#b088cc}
.speedbar-track{width:200px;height:8px;background:rgba(107,63,160,.3);border-radius:4px;overflow:hidden}
.speedbar-fill{height:100%;width:10%;background:linear-gradient(90deg,#ff71c4,#ff00de,#ffdf00);border-radius:4px;transition:width .2s}
.speed-label{color:#ff71c4;min-width:40px}
.active-powers{display:flex;gap:.5rem;min-height:20px;align-items:center}
.power-badge{font-size:.65rem;padding:2px 8px;border-radius:8px;animation:badgePulse 1s ease-in-out infinite}
@keyframes badgePulse{0%,100%{opacity:.8}50%{opacity:1}}
.mode-selector{display:flex;gap:1rem;margin-top:.6rem}
.mode-selector button{background:rgba(107,63,160,.25);color:#d4a0ff;border:1px solid #6b3fa0;padding:.45rem 1.2rem;border-radius:6px;cursor:pointer;font-size:.8rem;letter-spacing:.08em;transition:.2s}
.mode-selector button:hover{background:rgba(255,0,222,.15);border-color:#ff6fd8;color:#ff71c4}
.mode-selector button.active{border-color:#ff6fd8;box-shadow:0 0 14px rgba(255,0,222,.4);color:#ff71c4}
.mode-selector button:disabled{opacity:.4;cursor:default;box-shadow:none}
</style>
</head>
<body>
<h1>S Y N T H P O N G</h1>
<div class="scoreboard"><span class="s-left" id="sLeft">0</span><span class="divider">:</span><span class="s-right" id="sRight">0</span></div>
<canvas id="c" width="800" height="500"></canvas>
<div class="speedbar-container">
  <span class="speed-label" id="speedLabel">60 MPH</span>
  <div class="speedbar-track"><div class="speedbar-fill" id="speedFill"></div></div>
  <div class="active-powers" id="activePowers"></div>
</div>
<div class="mode-selector">
  <button id="btnVSCPU" class="active">VS CPU</button>
  <button id="btn2P">2 PLAYER</button>
</div>
<div class="controls">
  <button id="btnStart" class="active">Start</button>
  <button id="btnPause">Pause</button>
  <button id="btnRestart">Restart</button>
</div>
<div class="info">
  <span>P1: W / S</span>
  <span>P2: ↑ ↓ (2P mode)</span>
  <span>Pause: Space</span>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const sLeft=document.getElementById('sLeft'),sRight=document.getElementById('sRight');
const btnStart=document.getElementById('btnStart'),btnPause=document.getElementById('btnPause'),btnRestart=document.getElementById('btnRestart');
const speedFill=document.getElementById('speedFill'),speedLabel=document.getElementById('speedLabel'),activePowersEl=document.getElementById('activePowers');
const btnVSCPU=document.getElementById('btnVSCPU'),btn2P=document.getElementById('btn2P');

const PADDLE_W=12,PADDLE_H=85,PADDLE_R=4,PADDLE_MARGIN=18;
const BALL_SIZE=10,BALL_BASE_SPEED=4.5,BALL_MAX_SPEED=13,BALL_SPEED_INC=0.35;
const WIN_SCORE=7;

let state='idle';
let gameMode='cpu';
let player={x:PADDLE_MARGIN,y:H/2-PADDLE_H/2,w:PADDLE_W,h:PADDLE_H,score:0};
let ai={x:W-PADDLE_MARGIN-PADDLE_W,y:H/2-PADDLE_H/2,w:PADDLE_W,h:PADDLE_H,score:0,spd:3.8};
let balls=[];
let explosions=[];
let speedLines=[];
let powerUps=[];
const keys={};
let lastTime=0;
let bgSpeed=1;
let driveSpeed=60;
let t=0;
let hitCounter=0;

const POWER_TYPES={
  GROW:{name:'GROW PADDLE',color:'#ffdf00',duration:8,icon:'📏'},
  FREEZE:{name:'FREEZE AI',color:'#00e5ff',duration:5,icon:'❄️'},
  SLOW:{name:'SLOW AI',color:'#6ee7b7',duration:6,icon:'🐌'},
  ZAP:{name:'ZAP',color:'#ff6fd8',duration:3,icon:'⚡'},
  GHOST:{name:'GHOST BALL',color:'#ffdfdf',duration:4,icon:'👻'},
  MULTI:{name:'MULTI-BALL',color:'#ff9a56',duration:0,icon:'💣'},
  SWITCH:{name:'SWITCH PADDLES',color:'#c084fc',duration:7,icon:'🔄'},
  SHRINK:{name:'SHRINK P2',color:'#e74c3c',duration:7,icon:'📉'},
  BIG_BALL:{name:'BIG BALL',color:'#f39c12',duration:6,icon:'🎱'},
  SPEED_DEMON:{name:'SPEED DEMON',color:'#e67e22',duration:5,icon:'🔥'},
  REVERSE:{name:'REVERSE CTRL',color:'#9b59b6',duration:6,icon:'🔃'},
};

let activePowersP1={};
let activePowersRight={};
let activePowersGlobal={};
let playerGrow=0,rightGrow=0;
let playerFrozen=false,rightFrozen=false;
let playerSlow=false,rightSlow=false;
let playerZapped=false,rightZapped=false;
let playerReversed=false,rightReversed=false;
let playerShrink=0,rightShrink=0;
let bigBall=false,bigBallExtraSize=0;
let speedDemon=false;

const STAR_COUNT=100;
const stars=[];
for(let i=0;i<STAR_COUNT;i++) stars.push({x:Math.random()*W,y:Math.random()*H*.45,r:Math.random()*1.5+.3,tw:Math.random()*3+1,a:Math.random()});

const HORIZON=H*0.4;
const ROAD_HALF_W=300;
let roadOffset=0;

function resetBall(direction){
  const angle=(Math.random()-.5)*Math.PI/3;
  const spd=BALL_BASE_SPEED;
  balls.push({
    x:W/2,y:H/2,
    vx:spd*Math.cos(angle)*direction,
    vy:spd*Math.sin(angle),
    size:BALL_SIZE,
    trail:[]
  });
  explosions=[];
}

function resetGame(full){
  player.y=H/2-PADDLE_H/2;ai.y=H/2-PADDLE_H/2;
  if(full){
    player.score=0;ai.score=0;
    driveSpeed=60;hitCounter=0;
    activePowersP1={};activePowersRight={};activePowersGlobal={};
    playerGrow=0;rightGrow=0;
    playerFrozen=false;rightFrozen=false;
    playerSlow=false;rightSlow=false;
    playerZapped=false;rightZapped=false;
    playerReversed=false;rightReversed=false;
    playerShrink=0;rightShrink=0;
    bigBall=false;bigBallExtraSize=0;
    reverseControls=false;speedDemon=false;
    ai.h=PADDLE_H;
    balls=[];
  }
  sLeft.textContent=player.score;sRight.textContent=ai.score;
  resetBall(1);
}

function startGame(){resetGame(true);state='running';btnStart.blur();btnStart.classList.remove('active');btnPause.classList.add('active');btnVSCPU.disabled=true;btn2P.disabled=true;}
function pauseGame(){if(state==='running'){state='paused';btnPause.classList.remove('active');btnStart.classList.add('active');}else if(state==='paused'){state='running';btnPause.classList.add('active');btnStart.classList.remove('active');}}
function restartGame(){state='idle';resetGame(true);btnStart.classList.add('active');btnPause.classList.remove('active');btnVSCPU.disabled=false;btn2P.disabled=false;}

btnStart.addEventListener('click',()=>{if(state==='idle'||state==='gameover')startGame();});
btnPause.addEventListener('click',pauseGame);
btnRestart.addEventListener('click',restartGame);
btnVSCPU.addEventListener('click',()=>{gameMode='cpu';btnVSCPU.classList.add('active');btn2P.classList.remove('active');});
btn2P.addEventListener('click',()=>{gameMode='2p';btn2P.classList.add('active');btnVSCPU.classList.remove('active');});

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '&&(state==='running'||state==='paused')){e.preventDefault();pauseGame();}
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function boostSpeed(){
  driveSpeed=Math.min(driveSpeed+25,320);
  bgSpeed=driveSpeed/60;
  updateSpeedUI();
}

function updateSpeedUI(){
  const pct=(driveSpeed-60)/260*100;
  speedFill.style.width=Math.max(10,10+pct)+'%';
  speedLabel.textContent=driveSpeed+' MPH';
}

function hsl(h,s,l,a){return a!==undefined?`hsla(${h},${s}%,${l}%,${a})`:`hsl(${h},${s}%,${l}%)`;}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,'#05001a');
  g.addColorStop(0.3,'#12002e');
  g.addColorStop(0.65,'#2d004a');
  g.addColorStop(1,'#6b0030');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,HORIZON);
}

function drawStars(){
  for(const s of stars){
    const a=.25+.75*(0.5+0.5*Math.sin(s.a+bgSpeed*t*s.tw));
    ctx.fillStyle=`rgba(255,220,255,${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
}

function drawSun(){
  const cx=W/2, cy=HORIZON-20, r=55;
  const g=ctx.createLinearGradient(cx,cy-r,cx,cy+r);
  g.addColorStop(0,'#ffdf00');
  g.addColorStop(0.3,'#ff9a56');
  g.addColorStop(0.5,'#ff71c4');
  g.addColorStop(0.7,'#ff00de');
  g.addColorStop(1,'#6b0030');
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  ctx.fillStyle=g;
  ctx.fillRect(cx-r,cy-r,r*2,r*2);
  for(let i=0;i<7;i++){
    const ly=cy-r+8+i*10;
    const lh=2+i*1.3;
    ctx.fillStyle='rgba(5,0,26,0.5)';
    ctx.fillRect(cx-r,ly,r*2,lh);
  }
  ctx.restore();
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const glow=ctx.createRadialGradient(cx,cy,r*.2,cx,cy,r*3);
  glow.addColorStop(0,'rgba(255,112,196,0.2)');
  glow.addColorStop(0.5,'rgba(255,0,222,0.06)');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,HORIZON);
  ctx.restore();
}

function screenToWorld(yRatio){
  const y=HORIZON+(H-HORIZON)*yRatio;
  const scale=yRatio*yRatio;
  const lx=W/2-ROAD_HALF_W*scale;
  const rx=W/2+ROAD_HALF_W*scale;
  return{y,lx,rx,scale};
}

// --- POWER-UP ENGINE ---
function spawnPowerUp(){
  const keys=Object.keys(POWER_TYPES);
  const key=keys[Math.floor(Math.random()*keys.length)];
  const type=POWER_TYPES[key];
  const side=Math.random()<.3?-1:1;
  const spawnX=side===-1?player.x+25:ai.x-25;
  powerUps.push({
    x:spawnX,
    y:80+Math.random()*(H-160),
    r:10,
    vx:side*1.5,
    vy:(Math.random()-.5)*1.2,
    life:18,
    type:key,
    color:type.color,
    name:type.name,
    icon:type.icon
  });
}

// Apply power-up to a specific side ('left' for P1, 'right' for P2/CPU, 'both' for global)
function applyPowerUp(pu,target){
  const type=POWER_TYPES[pu.type];

  // Global effects (affect everyone)
  if(pu.type==='BIG_BALL'){
    bigBall=true;bigBallExtraSize=20;
    activePowersGlobal.BIG_BALL=type.duration;
  }
  if(pu.type==='MULTI'){
    const base=balls.length>0?balls[0]:{x:W/2,y:H/2};
    for(let i=0;i<2;i++){
      const angle=(Math.random()-.5)*Math.PI/2;
      const spd=BALL_BASE_SPEED;
      balls.push({
        x:base.x,y:base.y,
        vx:spd*Math.cos(angle),
        vy:spd*Math.sin(angle),
        size:BALL_SIZE,
        trail:[]
      });
    }
  }
  if(pu.type==='SPEED_DEMON'){
    speedDemon=true;
    activePowersGlobal.SPEED_DEMON=type.duration;
  }

  // Per-player effects
  const isFirst=target==='left'||target==='both';
  const isSecond=target==='right'||target==='both';

  if(pu.type==='GROW'){
    if(isFirst){playerGrow=Math.max(playerGrow,50);activePowersP1.GROW=type.duration;}
    if(isSecond){rightGrow=Math.max(rightGrow,50);activePowersRight.GROW=type.duration;}
  }
  if(pu.type==='FREEZE'){
    if(isFirst){playerFrozen=true;activePowersP1.FREEZE=type.duration;}
    if(isSecond){rightFrozen=true;activePowersRight.FREEZE=type.duration;}
  }
  if(pu.type==='SLOW'){
    if(isFirst){playerSlow=true;activePowersP1.SLOW=type.duration;}
    if(isSecond){rightSlow=true;activePowersRight.SLOW=type.duration;}
  }
  if(pu.type==='ZAP'){
    if(isFirst){playerZapped=true;activePowersP1.ZAP=type.duration;}
    if(isSecond){rightZapped=true;activePowersRight.ZAP=type.duration;}
  }
  if(pu.type==='SHRINK'){
    if(isFirst){playerShrink=Math.max(playerShrink,40);activePowersP1.SHRINK=type.duration;}
    if(isSecond){rightShrink=Math.max(rightShrink,40);activePowersRight.SHRINK=type.duration;}
  }
  if(pu.type==='REVERSE'){
    if(isFirst){playerReversed=true;activePowersP1.REVERSE=type.duration;}
    if(isSecond){rightReversed=true;activePowersRight.REVERSE=type.duration;}
  }

  updateActivePowersUI();
  spawnExplosion(pu.x,pu.y,type.color,type.color,type.color);
}

function updatePowerUps(dt){
  for(let i=powerUps.length-1;i>=0;i--){
    const pu=powerUps[i];
    pu.x+=pu.vx*60*dt;
    pu.y+=pu.vy*60*dt;
    if(pu.y<pu.r||pu.y>H-pu.r) pu.vy*=-1;
    if(pu.x<0||pu.x>W) pu.vx*=-1;
    pu.life-=dt;
    if(pu.life<=0){powerUps.splice(i,1);continue;}

    // Player 1 collect
    const p1h=player.h-playerShrink;
    const p1y=player.y+playerShrink/2;
    if(pu.x-pu.r<player.x+player.w&&pu.x+pu.r>player.x&&pu.y-pu.r<p1y+p1h&&pu.y+pu.r>p1y){
      applyPowerUp(pu,'left');powerUps.splice(i,1);continue;
    }

    // Right paddle (P2/CPU) collect
    const aiP2h=ai.h-rightShrink;
    const aiP2y=ai.y+rightShrink/2;
    if(pu.x-pu.r<ai.x+ai.w&&pu.x+pu.r>ai.x&&pu.y-pu.r<aiP2y+aiP2h&&pu.y+pu.r>aiP2y){
      applyPowerUp(pu,'right');powerUps.splice(i,1);
    }
  }
}

function tickPowers(dt){
  // Tick player 1 powers
  for(const k in activePowersP1){
    activePowersP1[k]-=dt;
    if(activePowersP1[k]<=0){
      delete activePowersP1[k];
      if(k==='GROW')playerGrow=0;
      if(k==='SHRINK')playerShrink=0;
      if(k==='FREEZE')playerFrozen=false;
      if(k==='SLOW')playerSlow=false;
      if(k==='ZAP')playerZapped=false;
      if(k==='REVERSE')playerReversed=false;
      updateActivePowersUI();
    }
  }

  // Tick right paddle powers
  for(const k in activePowersRight){
    activePowersRight[k]-=dt;
    if(activePowersRight[k]<=0){
      delete activePowersRight[k];
      if(k==='GROW')rightGrow=0;
      if(k==='SHRINK'){rightShrink=0;ai.h=PADDLE_H;}
      if(k==='FREEZE')rightFrozen=false;
      if(k==='SLOW'){rightSlow=false;ai.spd=3.8;}
      if(k==='ZAP')rightZapped=false;
      if(k==='REVERSE')rightReversed=false;
      updateActivePowersUI();
    }
  }

  // Tick global powers
  for(const k in activePowersGlobal){
    activePowersGlobal[k]-=dt;
    if(activePowersGlobal[k]<=0){
      delete activePowersGlobal[k];
      if(k==='BIG_BALL'){bigBall=false;bigBallExtraSize=0;}
      if(k==='SPEED_DEMON')speedDemon=false;
      updateActivePowersUI();
    }
  }
}

function updateActivePowersUI(){
  activePowersEl.innerHTML='';
  const allPowers=[
    ...Object.keys(activePowersP1).map(k=>({k,target:'P1'})),
    ...Object.keys(activePowersRight).map(k=>({k,target:gameMode==='2p'?'P2':'CPU'})),
    ...Object.keys(activePowersGlobal).map(k=>({k,target:'ALL'})),
  ];
  for(const entry of allPowers){
    const type=POWER_TYPES[entry.k];
    if(!type)continue;
    const source=entry.target==='P1'?activePowersP1:entry.target==='P2'||entry.target==='CPU'?activePowersRight:activePowersGlobal;
    if(!source||!source[entry.k])continue;
    const badge=document.createElement('span');
    badge.className='power-badge';
    badge.style.background=type.color+'22';
    badge.style.border='1px solid '+type.color;
    badge.style.color=type.color;
    badge.textContent=type.icon+' [${entry.target}] ' + Math.ceil(source[entry.k])+'s';
    activePowersEl.appendChild(badge);
  }
}

function drawPowerUps(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const pu of powerUps){
    const glow=ctx.createRadialGradient(pu.x,pu.y,0,pu.x,pu.y,pu.r*2.5);
    glow.addColorStop(0,pu.color);
    glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(pu.x,pu.y,pu.r*2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(pu.x,pu.y,pu.r,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.shadowColor=pu.color;ctx.shadowBlur=25;
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=pu.color;
    ctx.font='9px Segoe UI';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.icon,pu.x,pu.y+pu.r+12);
  }
  ctx.restore();
}

function drawRoad(){
  ctx.save();
  const groundFill=ctx.createLinearGradient(0,HORIZON,0,H);
  groundFill.addColorStop(0,'#0a0018');
  groundFill.addColorStop(1,'#150028');
  ctx.fillStyle=groundFill;
  ctx.fillRect(0,HORIZON,W,H-HORIZON);

  // Road fill with gradient
  const roadGrad=ctx.createLinearGradient(0,HORIZON,0,H);
  roadGrad.addColorStop(0,'#060012');
  roadGrad.addColorStop(1,'#0e0022');
  ctx.fillStyle=roadGrad;
  ctx.beginPath();
  const top=screenToWorld(0.001);
  const bot=screenToWorld(1);
  ctx.moveTo(top.lx,top.y);
  ctx.lineTo(top.rx,top.y);
  ctx.lineTo(bot.rx,bot.y);
  ctx.lineTo(bot.lx,bot.y);
  ctx.closePath();
  ctx.fill();

  // Road edges (neon lines)
  ctx.strokeStyle='#ff00de';
  ctx.lineWidth=2;
  ctx.shadowColor='#ff00de';
  ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.moveTo(top.lx,top.y);ctx.lineTo(bot.lx,bot.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(top.rx,top.y);ctx.lineTo(bot.rx,bot.y);
  ctx.stroke();
  ctx.shadowBlur=0;

  // Lane dashes
  const DASH_COUNT=12;
  const DASH_FRAC=0.18;
  const offsetFrac=roadOffset;
  for(let i=0;i<DASH_COUNT;i++){
    let fi=(i/DASH_COUNT+offsetFrac)%1;
    if(fi<0)fi+=1;
    const y1=HORIZON+(H-HORIZON)*(fi*fi);
    const y2=HORIZON+(H-HORIZON)*((fi+DASH_FRAC)*(fi+DASH_FRAC));
    if(y2>H)continue;
    const s1=fi*fi, s2=(fi+DASH_FRAC)*(fi+DASH_FRAC);
    const alpha=Math.min(1,s1*3)*0.8;
    ctx.strokeStyle=`rgba(0,229,255,${alpha})`;
    ctx.lineWidth=2+3*s2;
    ctx.shadowColor='#00e5ff';
    ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.moveTo(W/2,y1);ctx.lineTo(W/2,y2);
    ctx.stroke();
  }
  ctx.shadowBlur=0;

  ctx.restore();
}

function drawBuildings(){
  const vanishY=HORIZON;
  const speed=bgSpeed;
  // Left side buildings
  const buildings=[
    {x:80,w:40,h:120},{x:140,w:30,h:80},{x:190,w:50,h:140},{x:260,w:35,h:95},
    {x:W-120,w:40,h:110},{x:W-170,w:30,h:75},{x:W-230,w:50,h:130},{x:W-295,w:35,h:88}
  ];
  for(const b of buildings){
    const by=HORIZON;
    const bh=b.h*(1+0.15*Math.sin(t*speed+b.x*0.01));
    const g=ctx.createLinearGradient(b.x,by-bh,b.x,by);
    g.addColorStop(0,'rgba(107,63,160,0.3)');
    g.addColorStop(1,'rgba(15,0,30,0.6)');
    ctx.fillStyle=g;
    ctx.fillRect(b.x,by-bh,b.w,bh);
    // windows
    ctx.fillStyle=`rgba(255,0,222,${0.15+0.1*Math.sin(t*speed*2+b.x)})`;
    for(let wy=by-bh+8;wy<by-5;wy+=10){
      for(let wx=b.x+5;wx<b.x+b.w-5;wx+=8){
        if(Math.sin(wx*13+wy*7)>0.3)
          ctx.fillRect(wx,wy,3,5);
      }
    }
  }
}

function drawBackground(){
  drawSky();
  drawStars();
  drawSun();
  drawBuildings();
  drawRoad();
}

function drawRoundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();ctx.fill();
}

function drawPaddle(p,color,color2){
  const g=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
  g.addColorStop(0,color);
  g.addColorStop(1,color2);
  ctx.fillStyle=g;
  drawRoundedRect(p.x,p.y,p.w,p.h,PADDLE_R);
  ctx.shadowColor=color;ctx.shadowBlur=22;
  drawRoundedRect(p.x,p.y,p.w,p.h,PADDLE_R);
  ctx.shadowBlur=0;
}

function drawBall(){
  for(const b of balls){
    for(const tr of b.trail){
      ctx.globalAlpha=tr.alpha*.35;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(tr.x,tr.y,b.size/2,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.shadowColor='#fff';ctx.shadowBlur=25;
    const effSize=b.size+bigBallExtraSize*2;
    ctx.beginPath();ctx.arc(b.x,b.y,effSize/2+1,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
}

function drawOverlay(text,sub){
  ctx.fillStyle='rgba(8,0,26,0.6)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ff71c4';ctx.shadowColor='#ff00de';ctx.shadowBlur=30;
  ctx.font='bold 46px Segoe UI, sans-serif';
  ctx.fillText(text,W/2,H/2-25);
  ctx.shadowBlur=0;
  if(sub){ctx.font='18px Segoe UI, sans-serif';ctx.fillStyle='#b088cc';ctx.fillText(sub,W/2,H/2+25);}
}

// --- PHYSICS ---
function movePaddle(dt){
  if(playerFrozen)return;
  const effectiveSpd=playerSlow?0:1;
  const dir=playerReversed?-1:1;
  const spd=480;
  if(keys['w']||keys['W'])player.y-=spd*dt*dir*effectiveSpd;
  if(keys['s']||keys['S'])player.y+=spd*dt*dir*effectiveSpd;
  player.y=Math.max(0,Math.min(H-player.h,player.y));
}

function moveP2(dt){
  if(gameMode!=='2p')return;
  if(rightFrozen)return;
  const spd=480;
  const dir=rightReversed?-1:1;
  if(keys['ArrowUp'])ai.y-=spd*dt*dir;
  if(keys['ArrowDown'])ai.y+=spd*dt*dir;
  ai.y=Math.max(0,Math.min(H-ai.h,ai.y));
}

function moveAI(dt){
  if(gameMode!=='cpu')return;
  if(rightFrozen)return;
  const spd=rightSlow?ai.spd*0.35:ai.spd;
  const jitter=rightZapped?Math.sin(t*25)*4:0;
  const target=balls.length>0?balls[0].y+jitter:H/2;
  const center=ai.y+ai.h/2;
  const diff=target-center;
  if(Math.abs(diff)>12){
    ai.y+=Math.sign(diff)*Math.min(spd*60*dt,Math.abs(diff));
  }
  ai.y=Math.max(0,Math.min(H-ai.h,ai.y));
}

function moveBall(dt){
  const speedMult=speedDemon?2:1;
  const steps=8;
  for(let bIdx=balls.length-1;bIdx>=0;bIdx--){
    const b=balls[bIdx];
    const dx=b.vx*60*dt*speedMult/steps;
    const dy=b.vy*60*dt*speedMult/steps;
    const effSize=b.size+bigBallExtraSize*2;
    for(let i=0;i<steps;i++){
      b.x+=dx;b.y+=dy;
      if(b.y-effSize/2<=0){b.y=effSize/2;b.vy=Math.abs(b.vy);}
      if(b.y+effSize/2>=H){b.y=H-effSize/2;b.vy=-Math.abs(b.vy);}
      // Player hit
      if(b.vx<0&&b.x-effSize/2<=player.x+player.w&&b.x+effSize/2>=player.x){
        if(b.y+effSize/2>player.y&&b.y-effSize/2<player.y+player.h+playerGrow){
          const hit=(b.y-(player.y+(player.h+playerGrow)/2))/((player.h+playerGrow)/2);
          const spd=Math.min(Math.sqrt(b.vx*b.vx+b.vy*b.vy)+BALL_SPEED_INC,BALL_MAX_SPEED);
          const ang=hit*Math.PI/4;
          b.vx=spd*Math.cos(ang);b.vy=spd*Math.sin(ang);
          b.x=player.x+player.w+effSize/2;
          spawnExplosion(b.x,b.y,'#ff71c4','#ff00de','#ff9a56');
          boostSpeed();hitCounter++;
          if(hitCounter%4===0)spawnPowerUp();
        }
      }
      // Right paddle hit
      if(b.vx>0&&b.x+effSize/2>=ai.x&&b.x-effSize/2<=ai.x+ai.w){
        if(b.y+effSize/2>ai.y&&b.y-effSize/2<ai.y+ai.h){
          const hit=(b.y-(ai.y+ai.h/2))/(ai.h/2);
          const spd=Math.min(Math.sqrt(b.vx*b.vx+b.vy*b.vy)+BALL_SPEED_INC,BALL_MAX_SPEED);
          const ang=hit*Math.PI/4;
          b.vx=-spd*Math.cos(ang);b.vy=spd*Math.sin(ang);
          b.x=ai.x-effSize/2;
          spawnExplosion(b.x,b.y,'#00e5ff','#00b4d8','#6ee7b7');
          boostSpeed();hitCounter++;
          if(hitCounter%4===0)spawnPowerUp();
        }
      }
    }
    if(b.x<0){
      ai.score++;sRight.textContent=ai.score;checkWin();
      balls.splice(bIdx,1);
      if(balls.length<1&&state==='running')resetBall(1);
    }
    if(b.x>W){
      player.score++;sLeft.textContent=player.score;checkWin();
      balls.splice(bIdx,1);
      if(balls.length<1&&state==='running')resetBall(-1);
    }
  }
}

function checkWin(){if(player.score>=WIN_SCORE||ai.score>=WIN_SCORE)state='gameover';}

function addTrail(){for(const b of balls){b.trail.push({x:b.x,y:b.y,alpha:1});if(b.trail.length>14)b.trail.shift();}}

// --- EXPLOSIONS ---
function spawnExplosion(x,y,c1,c2,c3){
  const count=28;
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=50+Math.random()*180;
    const t=Math.random();
    explosions.push({
      x,y,
      vx:Math.cos(ang)*spd,
      vy:Math.sin(ang)*spd,
      radius:2+Math.random()*4,
      alpha:1,
      hue:Math.random()*40+320,
      sat:90,
      light:60+Math.random()*25,
      life:.7+Math.random()*.6
    });
  }
}

function updateExplosions(dt){
  for(let i=explosions.length-1;i>=0;i--){
    const p=explosions[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=1-2.5*dt;
    p.vy*=1-2.5*dt;
    p.life-=dt;
    p.alpha=Math.max(0,p.life*2.5);
    if(p.life<=0)explosions.splice(i,1);
  }
}

function manageSpeedLines(dt){
  if(bgSpeed>1.3&&Math.random()<bgSpeed*.35){
    speedLines.push({x:Math.random()*W,y:HORIZON+Math.random()*20,len:20+Math.random()*60,sp:80+Math.random()*120,alpha:bgSpeed*.08,hue:330+Math.random()*30});
  }
  for(let i=speedLines.length-1;i>=0;i--){
    const l=speedLines[i];
    l.y+=l.sp*dt;
    l.alpha-=dt*1.5;
    if(l.alpha<=0||l.y>H) speedLines.splice(i,1);
  }
}

function drawSpeedLines(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const l of speedLines){
    const g=ctx.createLinearGradient(l.x,l.y,l.x,l.y+l.len);
    g.addColorStop(0,`hsla(${l.hue},90%,70%,${l.alpha})`);
    g.addColorStop(1,`hsla(${l.hue},90%,70%,0)`);
    ctx.strokeStyle=g;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(l.x+Math.sin(l.y*.01)*8,l.y);ctx.lineTo(l.x,l.y+l.len);ctx.stroke();
  }
  ctx.restore();
}

function drawExplosions(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const p of explosions){
    const r=p.radius*3;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,hsl(p.hue,p.sat,p.light,p.alpha));
    g.addColorStop(0.3,hsl(p.hue+25,p.sat,p.light-10,p.alpha*.6));
    g.addColorStop(0.6,hsl(p.hue+50,p.sat-10,p.light-20,p.alpha*.25));
    g.addColorStop(1,hsl(p.hue+80,p.sat-20,p.light-30,0));
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// --- SCANLINES ---
function drawScanlines(){
  ctx.fillStyle='rgba(0,0,0,0.06)';
  for(let y=0;y<H;y+=2){
    ctx.fillRect(0,y,W,1);
  }
}

// --- VIGNETTE ---
function drawVignette(){
  const vg=ctx.createRadialGradient(W/2,H/2,W*.35,W/2,H/2,W*.75);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(8,0,26,0.6)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);
}

// --- EXHAUST / TAILLIGHT FLARE ---
function drawExhaust(dt){
  const bot=screenToWorld(0.95);
  const cx=W/2,cy=bot.y-5;
  const flame=bgSpeed*12+Math.sin(t*3)*(bgSpeed*6);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy+flame/2,flame*.6);
  g.addColorStop(0,'rgba(255,100,50,0.35)');
  g.addColorStop(0.5,'rgba(255,0,222,0.12)');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(cx,cy+flame/4,10+bgSpeed*2,flame*.6,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

let dt=0.016;
function gameLoop(ts){
  dt=lastTime?Math.min((ts-lastTime)/1000,0.05):0.016;
  lastTime=ts;
  t+=dt;

  // Road scroll
  roadOffset+=dt*bgSpeed*0.002;

  drawBackground();

  if(state==='running'){
    movePaddle(dt);
    moveP2(dt);
    moveAI(dt);
    moveBall(dt);
    addTrail();
    tickPowers(dt);
  }
  updateExplosions(dt);
  updatePowerUps(dt);
  manageSpeedLines(dt);
  for(const b of balls)for(const tr of b.trail)tr.alpha*=0.86;
  // Apply shrink effect to AI paddle
  ai.h=PADDLE_H;
  if(shrinkOpponent>0)ai.h=Math.max(20,PADDLE_H-shrinkOpponent);
  drawExhaust(dt);
  drawPowerUps();
  drawExplosions();
  drawSpeedLines();
  drawPaddle(player,'#ff9a56','#ff71c4');
  drawPaddle(ai,'#00e5ff','#0077b6');
  drawBall();
  drawScanlines();
  drawVignette();

  if(state==='idle')drawOverlay('SYNTH PONG','Press Start to play');
  if(state==='paused')drawOverlay('PAUSED','Press Space to resume');
  if(state==='gameover'){
    let winner;
    if(gameMode==='2p'){
      winner=player.score>=WIN_SCORE?'PLAYER 1 WINS':'PLAYER 2 WINS';
    }else{
      winner=player.score>=WIN_SCORE?'YOU WIN':'CPU WINS';
    }
    drawOverlay(winner,'Press Restart to play again');
  }

  requestAnimationFrame(gameLoop);
}

updateSpeedUI();
requestAnimationFrame(gameLoop);
</script>
